name: tiny_timezone
summary: 'A TinyMCE plugin that inserts a date/time in the author''s timezone, which the companion filter_timezone converts to each viewer''s timezone.'
description: |
  Adds an "Insert date/time with timezone" button and Insert-menu item to
  TinyMCE: a dialogue with a date/time picker and a timezone selector
  (populated from Moodle's own IANA list) inserts a tagged `<span>` carrying
  the timestamp and timezone. The companion **Timezone** text filter
  (`filter_timezone`) then renders it in each viewing user's own timezone.
labels:
